<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150d24" />
      <stop offset="100%" stop-color="#0c0714" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#2e1c52" stroke-width="4" />
  
  <!-- Graph Network Connections -->
  <g stroke="#3b2266" stroke-width="6" stroke-dasharray="6 4" opacity="0.8">
    <line x1="256" y1="256" x2="140" y2="160" />
    <line x1="256" y1="256" x2="372" y2="160" />
    <line x1="256" y1="256" x2="160" y2="360" />
    <line x1="256" y1="256" x2="352" y2="360" />
    <line x1="140" y1="160" x2="372" y2="160" stroke="#ec4899" stroke-width="4" stroke-dasharray="none" opacity="0.6" />
    <line x1="140" y1="160" x2="160" y2="360" />
    <line x1="372" y1="160" x2="352" y2="360" />
  </g>

  <!-- Outer Satellite Nodes -->
  <!-- Top Left -->
  <circle cx="140" cy="160" r="28" fill="#1e1136" stroke="#c084fc" stroke-width="5" />
  <circle cx="140" cy="160" r="12" fill="#c084fc" />

  <!-- Top Right -->
  <circle cx="372" cy="160" r="28" fill="#1e1136" stroke="#c084fc" stroke-width="5" />
  <circle cx="372" cy="160" r="12" fill="#c084fc" />

  <!-- Bottom Left -->
  <circle cx="160" cy="360" r="24" fill="#1e1136" stroke="#818cf8" stroke-width="4" />
  <circle cx="160" cy="360" r="10" fill="#818cf8" />

  <!-- Bottom Right -->
  <circle cx="352" cy="360" r="24" fill="#1e1136" stroke="#818cf8" stroke-width="4" />
  <circle cx="352" cy="360" r="10" fill="#818cf8" />

  <!-- Central Hub Node (Knowledge Graph Core) -->
  <circle cx="256" cy="256" r="64" fill="#241342" stroke="url(#accentGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="76" fill="none" stroke="#ec4899" stroke-width="3" stroke-dasharray="4 4" opacity="0.6" />
  <circle cx="256" cy="256" r="32" fill="url(#accentGrad)" />

  <!-- Core Knowledge Mark (Wiki-Link Brackets) -->
  <path d="M 238 236 L 226 236 L 226 276 L 238 276" fill="none" stroke="#faf5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 274 236 L 286 236 L 286 276 L 274 276" fill="none" stroke="#faf5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
